<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/temporal-polyfill@0.3.0/global.min.js"
	integrity="sha384-df2iQaZF4qu/OgVkNSZQqLfqm4saLMMEaHCH8tzdu0JcIZ4VR3Y22rvlq6W1HOjX" crossorigin="anonymous"></script>

<title>Decimal Time</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif, "Apple Color Emoji",
        "Segoe UI Emoji", "Segoe UI Symbol";
    background-color: #115;
    color: white;
}
#wrap {
    margin: auto;
    max-width: 800px;
    padding: 10px;
}
.title {
    text-align: center;
}
.time {
    text-align: center;
    white-space: nowrap;
    white-space-collapse: discard;
}
.local-times {
    margin: auto;
    text-align: center;
}
.local-time-desc {
    text-align: right;
}
.local-time-val {
    text-align: left;
}
.hidden {
    display: none;
}
.progress {
    text-align: center;
}
#progress-slider {
    width: 100%;
}
</style>

</head>
<body>

<div id="wrap">
    <h1 class="title">Decimal Time</h1>

    <h2 class="time">
        <span id="now"></span>
    </h1>
    <h3 id="local-times-header" class="local-times hidden">
        Local Times
    </h3>
    <table id="local-times-table" class="local-times hidden">
        <tr>
            <td class="local-time-desc">Midnight:</td>
            <td class="local-time-val" id="local-midnight"></td>
        </tr>
        <tr>
            <td class="local-time-desc">Morning:</td>
            <td class="local-time-val" id="local-morning"></td>
        </tr>
        <tr>
            <td class="local-time-desc">Noon:</td>
            <td class="local-time-val" id="local-noon"></td>
        </tr>
        <tr>
            <td class="local-time-desc">Evening:</td>
            <td class="local-time-val" id="local-evening"></td>
        </tr>
    </table>
    <p id="local-times-btn-wrap" class="local-times">
        <input id="local-times-btn" type="button"
            id="updateLocalTimes()"
            value="Get local times from current location">
    </p>
    <p class="progress">
        <input id="progress-slider" type="range" min="0" max="1" step="0.001" />
        <small id="progress-text"></small>
    </p>
</div>

<script>
const MAX = 1000;

let cache = {};
let sliderManuallyAdjusted = false;
function setContents(id, newValue, updateFn = null) {
    if (cache[id] == newValue) return;
    cache[id] = newValue;
    if (updateFn) {
        updateFn(newValue);
    } else {
        document.getElementById(id).innerHTML = newValue;
    }
}

function update() {
    const date = Temporal.Now.zonedDateTimeISO('UTC');
    const fraction = (date.since(date.startOfDay()).total('hours') / 24 * MAX);

    const s = `${date.year}-${date.month}-${date.day}\u2002${fraction.toLocaleString('en', { maximumFractionDigits: 3, minimumFractionDigits: 3 })}`;
    setContents('now', s);

    setContents('title', s, val => document.title = val);

    if (!sliderManuallyAdjusted) {
        document.getElementById('progress-slider').value = fraction / MAX;
    }
    let sliderValue = Math.round(document.getElementById('progress-slider').value * MAX);
    if (sliderValue >= MAX) {
        sliderValue = MAX - 1;
    }
    setContents('progress-text',
        sliderValue.toLocaleString('en', { maximumFractionDigits: 0 }) + '\u2002/\u2002' +
        Temporal.PlainTime.from('00:00').add({ minutes: Math.round(sliderValue / MAX * 24 * 60) }).toString({ smallestUnit: 'minute' }));

    window.requestAnimationFrame(update);
}

function localTimeConv(lonDegrees, offset = 0) {
    if (lonDegrees < -180 || lonDegrees > 180) {
        throw new Error('longitude out of range');
    }
    let res = lonDegrees / 360 * MAX;
    res += offset;
    while (res >= MAX) {
        res -= MAX;
    }
    while (res < 0) {
        res += MAX;
    }
    return res;
}

function localTimes(lonDegrees) {
    let timeStr = offset => {
        // these values are rounded to the nearest integer
        return localTimeConv(lonDegrees, offset).toLocaleString('en', { maximumFractionDigits: 0 });;
    }
    setContents('local-midnight', timeStr(0));
    setContents('local-morning', timeStr(MAX * 0.25));
    setContents('local-noon', timeStr(MAX * 0.5));
    setContents('local-evening', timeStr(MAX * 0.75));
}

window.onload = () => {
    tests();
    document.getElementById('local-times-btn').addEventListener('click', () => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(updatePosition);
        } else {
            alert("Geolocation is not supported by this browser");
        }
    });
    document.getElementById('progress-slider').addEventListener('input', e => {
        sliderManuallyAdjusted = true;
    });
    window.requestAnimationFrame(update);
};

function updatePosition(position) {
    localTimes(position.coords.longitude);
    document.getElementById('local-times-btn-wrap').classList.add('hidden');
    document.getElementById('local-times-header').classList.remove('hidden');
    document.getElementById('local-times-table').classList.remove('hidden');
}

function tests() {
    function assert(bool) {
        if (!bool) throw new Error("Assertion failed");
    }
    assert(localTimeConv(0) == 0);
    assert(localTimeConv(180) == MAX * 0.5);
    assert(localTimeConv(90) == MAX * 0.25);
    assert(localTimeConv(45) == MAX * 0.125);
    assert(localTimeConv(-180) == MAX * 0.5);
    assert(localTimeConv(-90) == MAX * 0.75);
    assert(localTimeConv(-45) == MAX * 0.875);
    assert(localTimeConv(-0.1) < MAX && localTimeConv(-0.1) > MAX * 0.999);
}

</script>

</body>
</html>
